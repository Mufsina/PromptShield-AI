name: PromptShield-AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Check application import
        run: |
          python -c "from deployment.app import app; print('Application import successful')"

            - name: Start FastAPI server
        run: |
          python -m uvicorn deployment.app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!

          echo "Waiting for FastAPI server..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI server is running!"
              break
            fi

            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "FastAPI server stopped unexpectedly."
              cat server.log
              exit 1
            fi

            sleep 1
          done

          if ! curl -s http://127.0.0.1:8000/health > /dev/null; then
            echo "FastAPI server failed to start."
            cat server.log
            exit 1
          fi
      - name: Run API tests
        run: |
          pytest tests/test_api.py -v